<div class="p-fluid p-4">

  <!-- Header Tabs -->
  <!-- <p-tabMenu [model]="tabs" class="mb-4"></p-tabMenu> -->

  <!-- Title -->
  <div class="mb-4">
    <h2 class="m-0">Stock Transfer Ledger</h2>
    <small class="text-500">
      Manage and monitor movement of pharmacy inventory across points
    </small>
  </div>

  <!-- Card -->
  <div class="p-card shadow-2 border-round-xl">

    <!-- Filters -->
    <div class="grid align-items-center mb-3">

      <!-- Filter Buttons -->
         <p-tabView
          [(activeIndex)]="activeTabIndex"
          (onChange)="onTabChange($event)">

          <p-tabPanel header="All"></p-tabPanel>
          <p-tabPanel header="Yet to Approve"></p-tabPanel>
          <p-tabPanel header="Approved & Active"></p-tabPanel>
          <p-tabPanel header="Rejected"></p-tabPanel>
          <p-tabPanel header="Completed"></p-tabPanel>

        </p-tabView>
      </div>

      <!-- Search -->
      <div class="col-12 md:col-4 text-right">
        <span class="p-input-icon-left w-full">
          <i class="pi pi-search"></i>
          <input pInputText
                 type="text"
                 placeholder="Search by Transfer ID or Initiator"
                 [(ngModel)]="searchText"
                 class="w-full" />
        </span>
      </div>

    </div>

    <!-- Table -->
    <p-table [value]="filteredTransfers()"
             responsiveLayout="scroll"
             class="p-datatable-sm">

      <ng-template pTemplate="header">
        <tr>
          <th>Reference & Date</th>
          <th>Route</th>
          <th>Initiator</th>
          <th>Items</th>
          <th>Value</th>
          <th>Status</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td>
            <strong>{{ row.ref }}</strong><br>
            <small class="text-500">{{ row.date }}</small>
          </td>
          <td>{{ row.route }}</td>
          <td>{{ row.initiator }}</td>
          <td>{{ row.items }}</td>
          <td>{{ row.value }}</td>
          <td>
            <!-- <p-tag [value]="row.status"
                   [severity]="statusSeverity[row.status]"> 
            </p-tag>-->
          </td>
        </tr>
      </ng-template>

    </p-table>

  </div>
<!-- </div> -->
